
name: SmartRouteAI CI and Dependency Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-security:
    name: Build and Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Build and run tests
        run: |
          chmod +x gradlew
          ./gradlew build


      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: dependency-check
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: SmartRouteAI
          path: .
          format: HTML
          out: reports
          args: >
            --failOnCVSS 7

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: warn
